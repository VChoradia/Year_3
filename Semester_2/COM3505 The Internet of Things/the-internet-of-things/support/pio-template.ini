; platformio.ini template
; try e.g.
;   pio run -t upload -t monitor

[platformio]
src_dir = sketch

; profile for Feather Huzzah ESP32
[env:featheresp32]
board = featheresp32

; choose platform and framework
platform = https://github.com/platformio/platform-espressif32
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.5

; upload, monitoring
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
