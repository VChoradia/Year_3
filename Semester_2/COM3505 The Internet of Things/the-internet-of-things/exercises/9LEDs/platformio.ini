; platformio.ini
; try e.g.
;   pio run -t upload -t monitor

[platformio]
src_dir = sketch

; profile for Feather ESP32S3
[env:adafruit_feather_esp32s3]
board = adafruit_feather_esp32s3
platform = espressif32 @ ^6.0.1
; the S3 Feather is unreliable to flash in some versions of the core; set the
; version to a commit that (hopefully!) fixes the issue:
platform_packages =
  platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#f69bbfe
; to use a different version of esptool (thanks Akhil!):
  platformio/tool-esptoolpy@1.40300.0

framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
;monitor_filters = direct

; choosing a version of the platform is something of a fine art!
; https://github.com/espressif/arduino-esp32/issues/5436
;
; other options:
;
; platform_packages =
;   platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.6
; platform = https://github.com/platformio/platform-espressif32.git#feature/arduino-upstream
; framework = arduino
; platform_packages = 
;    platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.0-rc1
;
; the development version:
; platform = https://github.com/platformio/platform-espressif32.git
; the stable release:
; platform = espressif32
; a particular version:
; platform = https://github.com/platformio/platform-espressif32.git#feature/arduino-idf-v4.2
; platform_packages =
;   framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#idf-release/v4.2
; framework = arduino, espidf
